<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karteikarten</title>
<meta name="theme-color" content="#F7F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17151A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Karteikarten">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Layout: phone-first, one column of deck tiles grouped by module; study view = one big card + two thumb buttons */
:root{
  --bg:#F7F5F2; --surface:#FFFFFF; --ink:#24212A; --muted:#6B6672; --line:#E6E1DC; --shadow:0 1px 2px rgb(40 30 50 / .06), 0 6px 20px rgb(40 30 50 / .07);
  --ok:#2F7D57; --ok-soft:#DDF0E5; --again:#B4442C; --again-soft:#FBE7E2;
  --font-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", "Avenir Next", system-ui, sans-serif;
  /* module palettes (from the Lernzettel colours) */
  --bio-soft:#FCEDF2; --bio-mid:#F3C6D3; --bio-ink:#8A3D55; --bio-acc:#C0627F;
  --mathe-soft:#E3F1E6; --mathe-mid:#B4DBBD; --mathe-ink:#33623F; --mathe-acc:#4B875B;
  --ana-soft:#E5F1FA; --ana-mid:#B7D7EE; --ana-ink:#2D5878; --ana-acc:#4A80AE;
  --chem-soft:#FCF6DF; --chem-mid:#F3E2A4; --chem-ink:#6B5418; --chem-acc:#A6862B;
  --prak-soft:#FDEFE5; --prak-mid:#F8CDB0; --prak-ink:#8A4A22; --prak-acc:#C8774A;
  --wa-soft:#F3F2EF; --wa-mid:#D9D6D1; --wa-ink:#4A4640; --wa-acc:#7D776E;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17151A; --surface:#211E25; --ink:#F1EDF3; --muted:#A9A2AE; --line:#34303A; --shadow:0 1px 2px rgb(0 0 0 / .4);
  --ok:#7CCBA0; --ok-soft:#1E3529; --again:#F19A85; --again-soft:#3A221D;
  --bio-soft:#33222A; --bio-mid:#5A3443; --bio-ink:#F3C6D3; --bio-acc:#E58FAB;
  --mathe-soft:#1F2E23; --mathe-mid:#2F4F37; --mathe-ink:#B4DBBD; --mathe-acc:#7FC08E;
  --ana-soft:#1C2833; --ana-mid:#2C4A63; --ana-ink:#B7D7EE; --ana-acc:#7FB2DD;
  --chem-soft:#2E2918; --chem-mid:#5A4B1E; --chem-ink:#F3E2A4; --chem-acc:#D6B45A;
  --prak-soft:#33251C; --prak-mid:#5E3B26; --prak-ink:#F8CDB0; --prak-acc:#E39A6C;
  --wa-soft:#262422; --wa-mid:#45413B; --wa-ink:#D9D6D1; --wa-acc:#ADA69C;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#17151A; --surface:#211E25; --ink:#F1EDF3; --muted:#A9A2AE; --line:#34303A; --shadow:0 1px 2px rgb(0 0 0 / .4);
  --ok:#7CCBA0; --ok-soft:#1E3529; --again:#F19A85; --again-soft:#3A221D;
  --bio-soft:#33222A; --bio-mid:#5A3443; --bio-ink:#F3C6D3; --bio-acc:#E58FAB;
  --mathe-soft:#1F2E23; --mathe-mid:#2F4F37; --mathe-ink:#B4DBBD; --mathe-acc:#7FC08E;
  --ana-soft:#1C2833; --ana-mid:#2C4A63; --ana-ink:#B7D7EE; --ana-acc:#7FB2DD;
  --chem-soft:#2E2918; --chem-mid:#5A4B1E; --chem-ink:#F3E2A4; --chem-acc:#D6B45A;
  --prak-soft:#33251C; --prak-mid:#5E3B26; --prak-ink:#F8CDB0; --prak-acc:#E39A6C;
  --wa-soft:#262422; --wa-mid:#45413B; --wa-ink:#D9D6D1; --wa-acc:#ADA69C;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
button:focus-visible,.tile:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* home */
.eyebrow{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.head{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.head h1{font-size:clamp(30px,7vw,40px);font-weight:800;letter-spacing:-.01em}
.head p{margin:0;color:var(--muted)}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.pill b{font-variant-numeric:tabular-nums}
.mix{margin:10px 0 24px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:16px;border:1px dashed var(--line);background:transparent;cursor:pointer;text-align:left}
.mix span{color:var(--muted);font-size:14px}
.mix:disabled{opacity:.5;cursor:default}
.group{margin-top:22px}
.group-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.group-h h2{font-size:20px;font-weight:700}
.exam{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--m-mid);color:var(--m-ink);white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:18px;background:var(--m-soft);border:1px solid color-mix(in oklab, var(--m-mid) 70%, transparent);cursor:pointer;text-align:left;min-width:0}
.tile h3{font-size:19px;font-weight:700;color:var(--m-ink)}
.tile .sub{font-size:14px;color:var(--muted);margin-top:-4px}
.bar{height:8px;border-radius:99px;background:color-mix(in oklab, var(--m-mid) 55%, var(--surface));overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .k{background:var(--m-acc)} .bar .u{background:color-mix(in oklab, var(--again) 55%, var(--m-mid))}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.install{display:flex;flex-direction:column;gap:12px;margin:4px 0 22px;padding:18px;border-radius:20px;background:var(--surface);border:2px solid var(--mathe-acc);box-shadow:var(--shadow)}
.install h2{font-size:21px;font-weight:800}
.install p{margin:0;color:var(--muted);font-size:15px}
.install ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:st}
.install li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;font-size:16px;line-height:1.45;counter-increment:st}
.install li::before{content:counter(st);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--mathe-mid);color:var(--mathe-ink);font-weight:800;font-family:var(--font-display)}
.install .ic{display:inline-flex;vertical-align:-5px;width:24px;height:24px;margin:0 2px;color:#0A84FF}
.install .ic svg{width:24px;height:24px}
.install small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.install .later{align-self:flex-start;border:1px solid var(--line);background:transparent;border-radius:12px;padding:8px 14px;font-weight:700;cursor:pointer;color:var(--muted)}
.installed{display:inline-flex;align-items:center;gap:6px;margin:0 0 14px;padding:6px 12px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-size:14px;font-weight:700}
.foot{margin-top:28px;font-size:13px;color:var(--muted)}
.foot button{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;color:var(--muted)}

/* study */
.study{display:flex;flex-direction:column;min-height:calc(100dvh - 40px);gap:14px}
.top{display:flex;align-items:center;gap:10px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:700}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-family:var(--font-display);font-size:18px;color:var(--m-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--m-acc);transition:width .25s}
.card{flex:1;display:flex;flex-direction:column;gap:14px;padding:22px 20px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);cursor:pointer;min-height:300px;position:relative}
.card .tag{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--m-soft);color:var(--m-ink)}
.q{font-family:var(--font-display);font-size:clamp(21px,5.2vw,26px);font-weight:700;line-height:1.25}
.a{border-top:2px solid var(--m-mid);padding-top:14px;font-size:clamp(17px,4.4vw,19px);line-height:1.55}
.a p{margin:0 0 6px}
.hint{margin-top:auto;font-size:14px;color:var(--muted);text-align:center}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:env(safe-area-inset-bottom,0px)}
.btn{padding:16px 12px;border-radius:16px;border:0;font-weight:700;font-size:17px;cursor:pointer}
.btn.again{background:var(--again-soft);color:var(--again)}
.btn.ok{background:var(--ok-soft);color:var(--ok)}
.btn.show{grid-column:1 / -1;background:var(--m-acc);color:var(--surface)}
.done{flex:1;display:flex;flex-direction:column;gap:14px;justify-content:center;text-align:center;padding:24px;border-radius:22px;background:var(--m-soft)}
.done h2{font-size:28px;color:var(--m-ink)}
.done .stats{display:flex;justify-content:center;gap:24px;font-variant-numeric:tabular-nums}
.done .stats b{display:block;font-family:var(--font-display);font-size:34px}
.done .stats .g b{color:var(--ok)} .done .stats .n b{color:var(--again)}
.done .row{display:flex;flex-direction:column;gap:10px;max-width:360px;margin:6px auto 0;width:100%}
.opt{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted);margin:2px 0 6px}
.opt input{width:20px;height:20px;accent-color:var(--m-acc)}
.update{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:0;border-radius:16px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);z-index:50;font:inherit;font-size:16px;text-align:left;cursor:pointer;touch-action:manipulation}
.update b{white-space:nowrap}
/* today + week */
.today{margin:6px 0 18px;padding:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.today h2{font-size:22px;font-weight:800}
.today .focus{margin:-6px 0 0;color:var(--muted);font-size:14px}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tasks label{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;font-size:15px;line-height:1.4;cursor:pointer}
.tasks input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--ok)}
.tasks input:checked + span{color:var(--muted);text-decoration:line-through}
.goal{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:14px;background:var(--ok-soft)}
.goal .gl{display:flex;justify-content:space-between;gap:10px;font-size:15px;font-weight:700;color:var(--ok)}
.goal .gbar{height:8px;border-radius:99px;background:color-mix(in oklab, var(--ok) 20%, var(--surface));overflow:hidden}
.goal .gbar i{display:block;height:100%;background:var(--ok)}
.goal button{border:0;border-radius:12px;padding:12px;font-weight:700;font-size:16px;background:var(--ok);color:var(--surface);cursor:pointer}
details.week{border-top:1px solid var(--line);padding-top:10px}
details.week summary{cursor:pointer;font-weight:700;font-size:15px}
.wday{margin-top:10px;font-size:14px}
.wday b{display:block;font-family:var(--font-display)}
.wday ul{margin:2px 0 0;padding-left:18px;color:var(--muted)}
.wday.is-today b{color:var(--ok)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 6px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:15px;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--ok)}
/* typing */
.type{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.type textarea{width:100%;min-height:96px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;resize:vertical}
.type small{color:var(--muted);font-size:13px}
.check{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--m-soft)}
.check .score{font-weight:700;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;padding:3px 10px;border-radius:999px;border:1px solid transparent}
.chip.hit{background:var(--ok-soft);color:var(--ok)}
.chip.miss{background:var(--again-soft);color:var(--again)}
.yours{font-size:14px;color:var(--muted);white-space:pre-wrap}
.btn.skip{background:var(--line);color:var(--ink)}
.btn.sug{outline:3px solid currentColor;outline-offset:-3px}
.examtag{font-size:11px;font-weight:800;letter-spacing:.05em;padding:2px 8px;border-radius:999px;background:var(--m-acc);color:var(--surface);align-self:flex-start}
/* deck overview + lessons (Stoff) */
.dhead{display:flex;flex-direction:column;gap:6px;margin:6px 0 14px}
.dhead h1{font-size:clamp(26px,6vw,34px);font-weight:800;color:var(--m-ink)}
.dhead p{margin:0;color:var(--muted);font-size:15px}
.dact{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 18px}
.chs{display:flex;flex-direction:column;gap:10px}
.ch{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;padding:14px;border-radius:18px;background:var(--m-soft);border:1px solid color-mix(in oklab, var(--m-mid) 70%, transparent)}
.ch .num{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--m-mid);color:var(--m-ink);font-family:var(--font-display);font-weight:800}
.ch .num.read{background:var(--m-acc);color:var(--surface)}
.ch h3{font-size:18px;color:var(--m-ink)}
.ch .sub{font-size:14px;color:var(--muted);margin:2px 0 8px}
.ch .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ch .row span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sbtn{border:0;border-radius:12px;padding:9px 14px;font-weight:700;font-size:15px;cursor:pointer;background:var(--m-acc);color:var(--surface)}
.sbtn.alt{background:var(--surface);color:var(--m-ink);border:1px solid var(--m-mid)}
.newtag{font-size:11px;font-weight:800;letter-spacing:.05em;padding:2px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.lesson{display:flex;flex-direction:column;gap:14px}
.stoff{padding:20px 18px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-size:17px;line-height:1.6;overflow-wrap:anywhere}
.stoff h2{font-size:24px;color:var(--m-ink);margin-bottom:4px}
.stoff h3{font-size:19px;color:var(--m-ink);margin:22px 0 8px;padding-top:12px;border-top:2px solid var(--m-mid)}
.stoff h2 + p.sub + h3,.stoff h2 + h3{border-top:0;padding-top:0}
.stoff h4{font-size:17px;margin:14px 0 6px}
.stoff p{margin:0 0 10px}
.stoff p.sub{color:var(--muted);font-size:15px}
.stoff ul{margin:0 0 12px;padding-left:20px}
.stoff li{margin:0 0 6px}
.stoff .box{margin:12px 0;padding:12px 14px;border-radius:14px;background:var(--m-soft);border-left:4px solid var(--m-acc)}
.stoff .fig{font-size:13px;color:var(--muted);font-style:italic;margin:4px 0 12px}
.stoff .link{font-size:14px;color:var(--m-ink);background:var(--m-soft);display:inline-block;padding:2px 10px;border-radius:999px}
.stoff table{display:block;overflow-x:auto;border-collapse:collapse;margin:12px 0;font-size:15px;max-width:100%}
.stoff th,.stoff td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left;min-width:90px}
.stoff th{background:var(--m-soft)}
.lnav{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
@media (prefers-reduced-motion: reduce){ .prog i{transition:none} }
/* Originalbilder (verschlüsselt, nach Passwort sichtbar) */
figure.pic{margin:12px 0 16px;padding:8px;border-radius:14px;background:#fff;border:1px solid var(--line)}
figure.pic img{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:8px;min-height:40px}
figure.pic img:not([src]){min-height:90px;background:repeating-linear-gradient(45deg,var(--m-soft),var(--m-soft) 10px,transparent 10px,transparent 20px);width:100%}
figure.pic figcaption{font-size:13px;color:#5d5866;margin-top:6px;line-height:1.4}
.card figure.pic{margin:4px 0}
.unlock{margin:12px 0;padding:14px;border-radius:14px;background:var(--m-soft);border:1px solid var(--m-mid);display:flex;flex-direction:column;gap:8px}
.unlock input{font:inherit;font-size:17px;padding:10px 12px;border-radius:10px;border:1px solid var(--line)}
.unlock button{font:inherit;font-weight:700;padding:10px;border-radius:10px;border:0;background:var(--m-acc);color:#fff}
.unlock small{color:var(--muted)}
/* Kartentyp-Badge */
.ktype{font-size:11px;font-weight:800;letter-spacing:.05em;padding:3px 9px;border-radius:999px;margin-left:6px;vertical-align:1px}
.ktype.klausur{background:var(--again-soft);color:var(--again)}
.ktype.begriff{background:var(--ok-soft);color:var(--ok)}
.ktype.bild{background:#ECE7FA;color:#5A4796}
.chip.c{border-style:dashed}
/* Karte melden */
.report{align-self:flex-start;background:none;border:0;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:0}
.repbox{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;border:1px dashed var(--line)}
.repbox textarea{font:inherit;font-size:16px;min-height:70px;padding:8px;border-radius:10px;border:1px solid var(--line)}
.repbox .r{display:flex;gap:8px}
.repbox .r button{flex:1;font:inherit;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.repbox .r button.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.reports{margin:0 0 18px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.reports .r{display:flex;gap:8px;flex-wrap:wrap}
.reports button{font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.reports button.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
window.__startApp = function(){
  const app = document.getElementById("app");
  // Stoff-Kapitel: neue Karten aus stoff.js an die Stapel hängen (bestehende Nummern bleiben gleich)
  const ST = (typeof STOFF !== "undefined") ? STOFF : {};
  Object.keys(ST).forEach(id => {
    let d = DECKS.find(x => x.id === id);
    if (!d && ST[id].deck){ d = Object.assign({ cards:[] }, ST[id].deck, { id }); DECKS.push(d); }
    if (!d) return;
    ST[id].chapters.forEach(ch => {
      ch.c = (ch.c || []).slice();
      (ch.neu || []).forEach(card => { d.cards.push(card); ch.c.push(d.cards.length - 1); });

      keyCache.set(ck, kv);
    }
    return crypto.subtle.decrypt({ name:"AES-CBC", iv:kv.iv }, kv.key, data);
  }
  async function loadImg(img){
    const rel = img.dataset.enc, mime = img.dataset.mime || "image/jpeg";
    if (urlCache.has(rel)){ img.src = urlCache.get(rel); return; }
    const res = await fetch(rel); if (!res.ok) throw new Error("net");
    const plain = await decryptBuf(await res.arrayBuffer(), pw);
    const url = URL.createObjectURL(new Blob([plain], { type:mime }));
    urlCache.set(rel, url); img.src = url;
  }
  function unlockImages(root){
    const imgs = Array.from(root.querySelectorAll("img[data-enc]")); if (!imgs.length) return;
    if (!pw || !(window.crypto && crypto.subtle)){
      if (root.querySelector(".unlock")) return;
      const box = document.createElement("div"); box.className = "unlock";
      box.innerHTML = `<b>Bilder aus den Skripten entsperren</b><input type="password" id="pwin" placeholder="Passwort" autocomplete="current-password"><button type="button" id="pwgo">Entsperren</button><small>Die Originalbilder liegen verschlüsselt im Netz. Passwort einmal eingeben, dann merkt sich die App es auf diesem Gerät.</small>`;
      const first = imgs[0].closest("figure") || imgs[0]; first.parentNode.insertBefore(box, first);
      box.querySelector("#pwgo").onclick = async () => {
        const v = box.querySelector("#pwin").value.trim(); if (!v) return;
        try { const r = await fetch(imgs[0].dataset.enc); await decryptBuf(await r.arrayBuffer(), v); pw = v; try { localStorage.setItem(PWKEY, v); } catch(e) {} box.remove(); unlockImages(root); }
        catch(e){ box.querySelector("small").textContent = "Passwort stimmt nicht (oder kein Netz). Nochmal versuchen."; }
      };
      return;
    }
    imgs.forEach(img => { if (!img.getAttribute("src")) loadImg(img).catch(() => { img.alt = "Bild gerade nicht verfügbar (offline?)"; }); });
  }

  let S = null; // session
  function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  // ---- Kapitel: Stoff lesen, dann Fragen ----
  function readOf(id, i){ const r = meta().read || {}; return !!r[id + ":" + i]; }
  function setRead(id, i){ meta().read = meta().read || {}; meta().read[id + ":" + i] = true; save(); }
  function chCounts(deck, ch){ let k = 0; ch.c.forEach(i => { if (statusOf(cid(deck, i)) === 2) k++; }); (ch.x || []).forEach(o => { if (statusOf(cid(o.deck, o.i)) === 2) k++; }); return { k, n: ch.c.length + (ch.x || []).length }; }
  function deckView(deck){
    S = null;
    const chs = ST[deck.id].chapters, c = counts(deck);
    const next = chs.findIndex((_, i) => !readOf(deck.id, i));
    let html = `<div style="${modVars(deck.modul)}"><div class="top"><button class="back" id="back">← Fächer</button></div>
      <header class="dhead"><span class="eyebrow">${esc(MODULES[deck.modul].name)}</span><h1>${esc(deck.name)}</h1><p>${esc(deck.sub)} · ${chs.length} Kapitel · ${c.k} von ${c.n} Karten gewusst</p></header>
      <div class="dact"><button class="btn show" id="go" style="grid-column:auto">${next >= 0 ? "Weiterlernen: Kap. " + (next + 1) : "Alles gelesen – wiederholen"}</button><button class="btn skip" id="all">Alle ${c.n} Karten abfragen</button></div>
      <div class="chs">`;
    chs.forEach((ch, i) => {
      const cc = chCounts(deck, ch), rd = readOf(deck.id, i);
      html += `<div class="ch"><span class="num ${rd ? "read" : ""}" aria-label="${rd ? "gelesen" : "noch nicht gelesen"}">${rd ? "✓" : i + 1}</span><div><h3>${esc(ch.t)} ${ch.neu && ch.neu.length ? `<span class="newtag">NEU</span>` : ""}</h3>${ch.sub ? `<div class="sub">${esc(ch.sub)}</div>` : ""}
        <div class="row"><button class="sbtn" data-read="${i}">Stoff lesen</button>${cc.n ? `<button class="sbtn alt" data-quiz="${i}">${cc.n} Fragen</button><span>${cc.k}/${cc.n} gewusst</span>` : ""}</div></div></div>`;
    });
    html += `</div></div>`;
    app.innerHTML = html;
    document.getElementById("back").onclick = home;
    document.getElementById("go").onclick = () => lesson(deck, next >= 0 ? next : 0);
    document.getElementById("all").onclick = () => start(deck);
    app.querySelectorAll("[data-read]").forEach(b => b.onclick = () => lesson(deck, +b.dataset.read));
    app.querySelectorAll("[data-quiz]").forEach(b => b.onclick = () => start(deck, false, +b.dataset.quiz));
    window.scrollTo(0, 0);
  }
  function lesson(deck, i){
    S = null;
    const chs = ST[deck.id].chapters, ch = chs[i];
    let html = `<div class="lesson" style="${modVars(deck.modul)}"><div class="top"><button class="back" id="back">← ${esc(deck.name)}</button>
      <div class="ttl"><b>Kapitel ${i + 1} von ${chs.length}</b><span>erst lesen, dann Fragen</span></div></div>
      <article class="stoff"><h2>${esc(ch.t)}</h2>${ch.sub ? `<p class="sub">${esc(ch.sub)}</p>` : ""}${ch.h}</article>
      <div class="lnav">${ch.c.length + ch.x.length ? `<button class="btn show" id="toq" style="grid-column:1 / -1">Gelesen – weiter zu ${ch.c.length + ch.x.length} Fragen</button>` : `<button class="btn show" id="nx" style="grid-column:1 / -1">${i + 1 < chs.length ? "Gelesen – nächstes Kapitel" : "Gelesen – fertig"}</button>`}</div></div>`;
    app.innerHTML = html;
    document.getElementById("back").onclick = () => deckView(deck);
    const toq = document.getElementById("toq"); if (toq) toq.onclick = () => { setRead(deck.id, i); start(deck, false, i); };
    const nx = document.getElementById("nx"); if (nx) nx.onclick = () => { setRead(deck.id, i); i + 1 < chs.length ? lesson(deck, i + 1) : deckView(deck); };
    unlockImages(app);
    window.scrollTo(0, 0);
  }

  function start(deck, onlyUnsure, chIdx){
    const chap = (chIdx !== undefined && ST[deck.id]) ? ST[deck.id].chapters[chIdx] : null;
    let items = deck.cards.map((c, i) => ({ deck, i, q: c[0], a: c[1], card: c }));
    if (chap){
      const set = new Set(chap.c); items = items.filter(it => set.has(it.i));
      // Reihenfolge: erst Fachbegriffe + klassische Karten, dann Bilder, zum Schluss Klausurfragen (auch aus den Altklausur-Stapeln)
      const ord = it => ({ begriff:0, bild:2, klausur:3 })[it.card[3]] ?? 1;
      items = items.concat((chap.x || []).map(o => ({ deck:o.deck, i:o.i, q:o.deck.cards[o.i][0], a:o.deck.cards[o.i][1], card:Object.assign(o.deck.cards[o.i].slice(), { 3:"klausur" }) })));
      items.sort((a, b) => ord(a) - ord(b));
    }
    if (onlyUnsure) items = items.filter(it => statusOf(cid(it.deck, it.i)) !== 2);
    S = { title: chap ? "Kap. " + (chIdx + 1) + " · " + chap.t : deck.name, modul: deck.modul, deck, ch: chap ? chIdx : undefined, queue: chap ? items : shuffle(items), done: 0, total: items.length, ok: 0, again: 0, flipped: false, missed: new Set() };
    study();
  }
  function startMixed(){
    let items = [];
    DECKS.forEach(d => d.cards.forEach((c, i) => { if (statusOf(cid(d, i)) === 1) items.push({ deck: d, i, q: c[0], a: c[1], card: c }); }));
    S = { title: "Unsichere Karten", modul: null, deck: null, queue: shuffle(items), done: 0, total: items.length, ok: 0, again: 0, flipped: false, missed: new Set() };
    study();
  }

  function study(){
    const it = S.queue[0];
    const m = it ? it.deck.modul : (S.modul || "bio");
    const pct = S.total ? (S.done / S.total * 100) : 100;
    let html = `<div class="study" style="${modVars(m)}"><div class="top"><button class="back" id="back">← ${S.deck && ST[S.deck.id] ? esc(S.deck.name) : "Fächer"}</button>
      <div class="ttl"><b>${esc(S.title)}</b><span>${Math.min(S.done + 1, S.total)} / ${S.total}${S.queue.length > S.total - S.done ? " · " + (S.queue.length - (S.total - S.done)) + " zur Wiederholung" : ""}</span></div></div>
      <div class="prog" aria-hidden="true"><i style="width:${pct}%"></i></div>`;
    if (!it){
      html += `<div class="done"><h2>Runde geschafft</h2><div class="stats"><div class="g"><b>${S.ok}</b>gewusst</div><div class="n"><b>${S.missed.size}</b>nochmal</div></div>
        <div class="row">${S.missed.size && S.deck ? `<button class="btn show" id="redo">Nur die unsicheren nochmal</button>` : ""}${S.ch !== undefined && S.ch + 1 < ST[S.deck.id].chapters.length ? `<button class="btn show" id="nextch">Nächstes Kapitel lesen</button>` : ""}<button class="btn ok" id="home2">${S.deck && ST[S.deck.id] ? "Zur Kapitelübersicht" : "Zurück zu den Fächern"}</button></div></div></div>`;
      app.innerHTML = html;
      const toDeck = () => (S.deck && ST[S.deck.id]) ? deckView(S.deck) : home();
      document.getElementById("back").onclick = toDeck;
      document.getElementById("home2").onclick = toDeck;
      const r = document.getElementById("redo"); if (r) r.onclick = () => start(S.deck, true, S.ch);
      const nc = document.getElementById("nextch"); if (nc) nc.onclick = () => lesson(S.deck, S.ch + 1);
      return;
    }
    const tag = S.deck ? MODULES[m].name : MODULES[m].name + " · " + it.deck.name;
    const typing = typingOn();
    let checkHtml = "", sug = null;
    if (S.flipped && S.typed !== undefined){
      if (S.typed.trim()){
        const c = checkAnswer(it.card || [it.q, it.a], S.typed);
        sug = c.pct >= 70 ? "ok" : "again";
        checkHtml = `<div class="check"><div class="score">${c.pct >= 70 ? "Sehr gut" : c.pct >= 40 ? "Teilweise" : "Noch nicht"} – ${c.res.filter(r => r.hit).length} von ${c.res.length} Punkten</div>
          <div class="chips">${c.res.map(r => `<span class="chip ${r.hit ? "hit" : "miss"} ${r.c ? "c" : ""}" title="${r.c ? "Inhalt – sinngemäß" : "Fachbegriff"}">${r.hit ? "✓" : "✗"} ${r.c ? "Sinn: " : ""}${esc(r.k)}</span>`).join("")}</div>
          <div class="yours">Deine Antwort: ${esc(S.typed)}</div>${c.auto ? `<small style="color:var(--muted)">Punkte automatisch aus der Antwort gewählt – vergleiche selbst mit der Lösung. Falsch bewertet? Unten „Karte melden“.</small>` : ""}</div>`;
      } else { sug = "again"; }
    }
    html += `<div class="card" id="card" ${typing && !S.flipped ? "" : `role="button" tabindex="0" aria-label="Karte umdrehen"`}><span class="tag">${esc(tag)}${it.deck.exam ? " · Altklausur" : ""}</span>
      <div class="q">${esc(it.q)}${ktype(it.card)}</div>${it.card && it.card[4] ? it.card[4] : ""}
      ${S.flipped ? `${checkHtml}<div class="a">${paras(it.a)}</div>${S.rep ? `<div class="repbox"><b>Was stimmt an der Karte nicht?</b><textarea id="rept" placeholder="z. B. Frage ungenau, Antwort falsch, richtige Antwort als falsch bewertet …"></textarea><div class="r"><button id="repno" type="button">Abbrechen</button><button class="go" id="repyes" type="button">Meldung speichern</button></div></div>` : S.repDone ? `<small style="color:var(--ok)">✓ Gemeldet – auf der Startseite an Notizen schicken.</small>` : `<button class="report" id="rep" type="button">⚑ Karte melden</button>`}`
        : typing ? `<div class="type"><textarea id="ta" placeholder="Antwort oder nur die Fachwörter eintippen …" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea><small>Tippfehler und Groß/Klein sind egal. Strg/Cmd+Enter = prüfen.</small></div>`
        : `<div class="hint">Antwort im Kopf überlegen, dann tippen</div>`}</div>
      <div class="btns">${S.flipped
        ? `<button class="btn again ${sug === "again" ? "sug" : ""}" id="again">Nochmal</button><button class="btn ok ${sug === "ok" ? "sug" : ""}" id="ok">Gewusst</button>`
        : typing ? `<button class="btn skip" id="skip">Weiß ich nicht</button><button class="btn ok" id="chk">Prüfen</button>`
        : `<button class="btn show" id="show">Antwort zeigen</button>`}</div></div>`;
    app.innerHTML = html;
    document.getElementById("back").onclick = () => (S.deck && ST[S.deck.id]) ? deckView(S.deck) : home();
    const flip = () => { if (!S.flipped){ S.flipped = true; study(); } };
    if (!S.flipped && typing){
      const ta = document.getElementById("ta");
      const go = v => { S.typed = v; S.flipped = true; study(); };
      document.getElementById("chk").onclick = () => go(ta.value);
      document.getElementById("skip").onclick = () => go("");
      ta.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)){ e.preventDefault(); go(ta.value); } });
      setTimeout(() => { try { ta.focus({ preventScroll:true }); } catch(e){} }, 50);
    } else if (!S.flipped){
      document.getElementById("card").onclick = flip;
      document.getElementById("show").onclick = flip;
    } else {
      document.getElementById("again").onclick = () => answer(false);
      document.getElementById("ok").onclick = () => answer(true);
      const rep = document.getElementById("rep"); if (rep) rep.onclick = e => { e.stopPropagation(); S.rep = true; study(); setTimeout(() => { const t = document.getElementById("rept"); if (t) t.focus(); }, 50); };
      const rno = document.getElementById("repno"); if (rno) rno.onclick = () => { S.rep = false; study(); };
      const ryes = document.getElementById("repyes"); if (ryes) ryes.onclick = () => {
        const why = document.getElementById("rept").value.trim();
        const m = meta(); m.reports = m.reports || [];
        m.reports.push({ d: todayISO(), deck: it.deck.id, i: it.i, q: it.q, why, typed: S.typed || "" });
        save(); S.rep = false; S.repDone = true; study();
      };
    }
    unlockImages(app);
  }
  function answer(ok){
    const it = S.queue.shift(); const id = cid(it.deck, it.i);
    if (ok){
      store[id] = S.missed.has(id) ? 1 : 2;
      S.done++; S.ok += S.missed.has(id) ? 0 : 1;
    } else {
      store[id] = 1; S.missed.add(id);
      const pos = Math.min(S.queue.length, 3 + Math.floor(Math.random() * 3));
      S.queue.splice(pos, 0, it);
    }
    const lg = meta().log; lg[todayISO()] = (lg[todayISO()] || 0) + 1;
    save(); S.flipped = false; S.typed = undefined; S.rep = false; S.repDone = false; study();
  }
  document.addEventListener("keydown", e => {
    if (!S || !document.getElementById("card")) return;
    if (document.activeElement && document.activeElement.tagName === "TEXTAREA") return;
    if ((e.key === " " || e.key === "Enter") && !typingOn()){ e.preventDefault(); if (!S.flipped){ S.flipped = true; study(); } }
    else if (S.flipped && (e.key === "1" || e.key === "ArrowLeft")) answer(false);
    else if (S.flipped && (e.key === "2" || e.key === "ArrowRight")) answer(true);
  });
  home();
};
</script>
<script>
// Schutz: Karten (cards.bin) und Lernstoff (stoff.bin) liegen verschlüsselt im Netz.
// Das Passwort wird nur auf diesem Gerät gespeichert (dasselbe wie für die Bilder).
(function(){
  const app = document.getElementById("app");
  const KEY = "bia1-bildpw";
  async function dec(buf, pass){
    const u = new Uint8Array(buf);
    if (String.fromCharCode(...u.slice(0, 8)) !== "Salted__") throw new Error("format");
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
    const bits = new Uint8Array(await crypto.subtle.deriveBits({ name:"PBKDF2", salt:u.slice(8, 16), iterations:100000, hash:"SHA-256" }, base, 384));
    const key = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name:"AES-CBC", iv:bits.slice(32, 48) }, key, u.slice(16)));
  }
  function addScript(code){
    return new Promise((ok, bad) => { const s = document.createElement("script"); s.src = URL.createObjectURL(new Blob([code], { type:"text/javascript" })); s.onload = ok; s.onerror = bad; document.body.appendChild(s); });
  }
  async function open(pass){
    const [a, b] = await Promise.all(["cards.bin", "stoff.bin"].map(f => fetch(f).then(r => { if (!r.ok) throw new Error("net"); return r.arrayBuffer(); })));
    const cards = await dec(a, pass), stoff = await dec(b, pass);   // wirft bei falschem Passwort
    try { localStorage.setItem(KEY, pass); } catch(_) {}
    await addScript(cards); await addScript(stoff);
    window.__startApp();
  }
  function lock(msg){
    app.innerHTML = `<div style="max-width:420px;margin:18vh auto 0;display:flex;flex-direction:column;gap:12px">
      <h1 style="font-family:var(--font-display);font-size:30px">Karteikarten</h1>
      <p style="color:var(--muted)">Diese Seite ist geschützt. Bitte Passwort eingeben – die App merkt es sich auf diesem Gerät.</p>
      <form id="lf" style="display:flex;flex-direction:column;gap:10px">
        <input id="lp" type="password" autocomplete="current-password" placeholder="Passwort" style="font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)">
        <button style="font:inherit;font-weight:700;font-size:17px;padding:12px;border-radius:12px;border:0;background:var(--ink);color:var(--bg)">Öffnen</button>
      </form>
      <p id="lm" style="color:var(--again);min-height:1.4em">${msg || ""}</p></div>`;
    document.getElementById("lf").onsubmit = async e => {
      e.preventDefault();
      const v = document.getElementById("lp").value.trim(); if (!v) return;
      document.getElementById("lm").textContent = "Wird geöffnet …";
      try { await open(v); }
      catch(err){ document.getElementById("lm").textContent = err.message === "net" ? "Keine Verbindung – bitte mit Internet erneut versuchen." : "Passwort stimmt nicht."; }
    };
  }
  let pw = null; try { pw = localStorage.getItem(KEY); } catch(e) {}
  if (!(window.crypto && crypto.subtle)) { app.innerHTML = "<p>Dieser Browser kann die geschützte Seite nicht öffnen.</p>"; return; }
  if (pw) open(pw).catch(err => lock(err.message === "net" ? "Keine Verbindung." : "Passwort hat sich geändert – bitte neu eingeben."));
  else lock();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(reg => {
    document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
}
</script>
