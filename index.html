<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karteikarten</title>
<meta name="theme-color" content="#F7F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17151A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Karteikarten">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Layout: phone-first, one column of deck tiles grouped by module; study view = one big card + two thumb buttons */
:root{
  --bg:#F7F5F2; --surface:#FFFFFF; --ink:#24212A; --muted:#6B6672; --line:#E6E1DC; --shadow:0 1px 2px rgb(40 30 50 / .06), 0 6px 20px rgb(40 30 50 / .07);
  --ok:#2F7D57; --ok-soft:#DDF0E5; --again:#B4442C; --again-soft:#FBE7E2;
  --font-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", "Avenir Next", system-ui, sans-serif;
  /* module palettes (from the Lernzettel colours) */
  --bio-soft:#FCEDF2; --bio-mid:#F3C6D3; --bio-ink:#8A3D55; --bio-acc:#C0627F;
  --chem-soft:#E3F1E6; --chem-mid:#B4DBBD; --chem-ink:#33623F; --chem-acc:#4B875B;
  --ana-soft:#E5F1FA; --ana-mid:#B7D7EE; --ana-ink:#2D5878; --ana-acc:#4A80AE;
  --mathe-soft:#FCF6DF; --mathe-mid:#F3E2A4; --mathe-ink:#6B5418; --mathe-acc:#A6862B;
  --prak-soft:#FDEFE5; --prak-mid:#F8CDB0; --prak-ink:#8A4A22; --prak-acc:#C8774A;
  --wa-soft:#F2EEFA; --wa-mid:#D6CCEE; --wa-ink:#4E3F7A; --wa-acc:#7D69B3;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17151A; --surface:#211E25; --ink:#F1EDF3; --muted:#A9A2AE; --line:#34303A; --shadow:0 1px 2px rgb(0 0 0 / .4);
  --ok:#7CCBA0; --ok-soft:#1E3529; --again:#F19A85; --again-soft:#3A221D;
  --bio-soft:#33222A; --bio-mid:#5A3443; --bio-ink:#F3C6D3; --bio-acc:#E58FAB;
  --chem-soft:#1F2E23; --chem-mid:#2F4F37; --chem-ink:#B4DBBD; --chem-acc:#7FC08E;
  --ana-soft:#1C2833; --ana-mid:#2C4A63; --ana-ink:#B7D7EE; --ana-acc:#7FB2DD;
  --mathe-soft:#2E2918; --mathe-mid:#5A4B1E; --mathe-ink:#F3E2A4; --mathe-acc:#D6B45A;
  --prak-soft:#33251C; --prak-mid:#5E3B26; --prak-ink:#F8CDB0; --prak-acc:#E39A6C;
  --wa-soft:#25213A; --wa-mid:#40375F; --wa-ink:#D6CCEE; --wa-acc:#A796DB;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#17151A; --surface:#211E25; --ink:#F1EDF3; --muted:#A9A2AE; --line:#34303A; --shadow:0 1px 2px rgb(0 0 0 / .4);
  --ok:#7CCBA0; --ok-soft:#1E3529; --again:#F19A85; --again-soft:#3A221D;
  --bio-soft:#33222A; --bio-mid:#5A3443; --bio-ink:#F3C6D3; --bio-acc:#E58FAB;
  --chem-soft:#1F2E23; --chem-mid:#2F4F37; --chem-ink:#B4DBBD; --chem-acc:#7FC08E;
  --ana-soft:#1C2833; --ana-mid:#2C4A63; --ana-ink:#B7D7EE; --ana-acc:#7FB2DD;
  --mathe-soft:#2E2918; --mathe-mid:#5A4B1E; --mathe-ink:#F3E2A4; --mathe-acc:#D6B45A;
  --prak-soft:#33251C; --prak-mid:#5E3B26; --prak-ink:#F8CDB0; --prak-acc:#E39A6C;
  --wa-soft:#25213A; --wa-mid:#40375F; --wa-ink:#D6CCEE; --wa-acc:#A796DB;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
button:focus-visible,.tile:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* home */
.eyebrow{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.head{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.head h1{font-size:clamp(30px,7vw,40px);font-weight:800;letter-spacing:-.01em}
.head p{margin:0;color:var(--muted)}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.pill b{font-variant-numeric:tabular-nums}
.mix{margin:10px 0 24px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:16px;border:1px dashed var(--line);background:transparent;cursor:pointer;text-align:left}
.mix span{color:var(--muted);font-size:14px}
.mix:disabled{opacity:.5;cursor:default}
.group{margin-top:22px}
.group-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.group-h h2{font-size:20px;font-weight:700}
.exam{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--m-mid);color:var(--m-ink);white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:18px;background:var(--m-soft);border:1px solid color-mix(in oklab, var(--m-mid) 70%, transparent);cursor:pointer;text-align:left;min-width:0}
.tile h3{font-size:19px;font-weight:700;color:var(--m-ink)}
.tile .sub{font-size:14px;color:var(--muted);margin-top:-4px}
.bar{height:8px;border-radius:99px;background:color-mix(in oklab, var(--m-mid) 55%, var(--surface));overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .k{background:var(--m-acc)} .bar .u{background:color-mix(in oklab, var(--again) 55%, var(--m-mid))}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.foot{margin-top:28px;font-size:13px;color:var(--muted)}
.foot button{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;color:var(--muted)}

/* study */
.study{display:flex;flex-direction:column;min-height:calc(100dvh - 40px);gap:14px}
.top{display:flex;align-items:center;gap:10px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:700}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-family:var(--font-display);font-size:18px;color:var(--m-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--m-acc);transition:width .25s}
.card{flex:1;display:flex;flex-direction:column;gap:14px;padding:22px 20px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);cursor:pointer;min-height:300px;position:relative}
.card .tag{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--m-soft);color:var(--m-ink)}
.q{font-family:var(--font-display);font-size:clamp(21px,5.2vw,26px);font-weight:700;line-height:1.25}
.a{border-top:2px solid var(--m-mid);padding-top:14px;font-size:clamp(17px,4.4vw,19px);line-height:1.55}
.a p{margin:0 0 6px}
.hint{margin-top:auto;font-size:14px;color:var(--muted);text-align:center}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:env(safe-area-inset-bottom,0px)}
.btn{padding:16px 12px;border-radius:16px;border:0;font-weight:700;font-size:17px;cursor:pointer}
.btn.again{background:var(--again-soft);color:var(--again)}
.btn.ok{background:var(--ok-soft);color:var(--ok)}
.btn.show{grid-column:1 / -1;background:var(--m-acc);color:var(--surface)}
.done{flex:1;display:flex;flex-direction:column;gap:14px;justify-content:center;text-align:center;padding:24px;border-radius:22px;background:var(--m-soft)}
.done h2{font-size:28px;color:var(--m-ink)}
.done .stats{display:flex;justify-content:center;gap:24px;font-variant-numeric:tabular-nums}
.done .stats b{display:block;font-family:var(--font-display);font-size:34px}
.done .stats .g b{color:var(--ok)} .done .stats .n b{color:var(--again)}
.done .row{display:flex;flex-direction:column;gap:10px;max-width:360px;margin:6px auto 0;width:100%}
.opt{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted);margin:2px 0 6px}
.opt input{width:20px;height:20px;accent-color:var(--m-acc)}
.update{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:0;border-radius:16px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);z-index:50;font:inherit;font-size:16px;text-align:left;cursor:pointer;touch-action:manipulation}
.update b{white-space:nowrap}
@media (prefers-reduced-motion: reduce){ .prog i{transition:none} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<button class="update" id="update" type="button" hidden><span>Neue Karten sind da.</span><b>Tippen zum Laden</b></button>
<script src="cards.js"></script>
<script>
(function(){
  const app = document.getElementById("app");
  const KEY = "bia1-karten-v1";
  let store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { store = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const paras = s => s.split("\n").map(l => "<p>" + esc(l) + "</p>").join("");
  const cid = (d, i) => d.id + ":" + i;
  const statusOf = id => store[id] || 0;           // 0 neu, 1 unsicher, 2 gewusst
  const modVars = m => `--m-soft:var(--${m}-soft);--m-mid:var(--${m}-mid);--m-ink:var(--${m}-ink);--m-acc:var(--${m}-acc)`;
  const daysTo = iso => { if(!iso) return null; const t = new Date(iso + "T09:00:00"); return Math.ceil((t - new Date()) / 864e5); };

  function counts(deck){
    let k = 0, u = 0;
    deck.cards.forEach((_, i) => { const s = statusOf(cid(deck, i)); if (s === 2) k++; else if (s === 1) u++; });
    return { k, u, n: deck.cards.length };
  }

  function home(){
    let total = 0, known = 0, unsure = 0;
    DECKS.forEach(d => { const c = counts(d); total += c.n; known += c.k; unsure += c.u; });
    const order = ["bio", "chem", "ana", "mathe", "prak", "wa"];
    let html = `<header class="head"><span class="eyebrow">BIA-1 · WiSe 26/27</span><h1>Karteikarten</h1>
      <p>Tippe auf eine Karte, um die Antwort zu sehen. Dein Stand wird auf diesem Gerät gespeichert.</p></header>
      <div class="summary"><span class="pill"><b>${total}</b> Karten</span><span class="pill"><b>${known}</b> gewusst</span><span class="pill"><b>${unsure}</b> unsicher</span></div>
      <button class="mix" id="mix" ${unsure ? "" : "disabled"}><div><b>Unsichere Karten aus allen Fächern</b><br><span>${unsure ? unsure + " Karten zum Wiederholen" : "Noch keine – erst ein Fach lernen"}</span></div><span aria-hidden="true">→</span></button>`;
    order.forEach(m => {
      const decks = DECKS.filter(d => d.modul === m); if (!decks.length) return;
      const mod = MODULES[m]; const dd = daysTo(mod.exam);
      const chip = mod.exam && dd !== null && dd >= 0 ? `${mod.examLabel} · noch ${dd} ${dd === 1 ? "Tag" : "Tage"}` : mod.examLabel;
      html += `<section class="group" style="${modVars(m)}"><div class="group-h"><h2>${esc(mod.name)}</h2><span class="exam">${esc(chip)}</span></div><div class="tiles">`;
      decks.forEach(d => {
        const c = counts(d);
        html += `<button class="tile" data-deck="${d.id}"><h3>${esc(d.name)}</h3><div class="sub">${esc(d.sub)}</div>
          <div class="bar" aria-hidden="true"><i class="k" style="width:${c.k / c.n * 100}%"></i><i class="u" style="width:${c.u / c.n * 100}%"></i></div>
          <div class="meta"><span>${c.k} von ${c.n} gewusst</span><span>${c.u ? c.u + " unsicher" : ""}</span></div></button>`;
      });
      html += `</div></section>`;
    });
    html += `<p class="foot">Karten aus deinen Lernzetteln · Version ${typeof APP_VERSION !== "undefined" ? APP_VERSION : ""}. <button id="reset">Lernstand zurücksetzen</button> <span id="resetq" hidden>– wirklich? <button id="resetyes">Ja, alles auf neu</button></span></p>`;
    app.innerHTML = html;
    app.querySelectorAll(".tile").forEach(b => b.onclick = () => start(DECKS.find(d => d.id === b.dataset.deck)));
    const mix = document.getElementById("mix");
    mix.onclick = () => startMixed();
    document.getElementById("reset").onclick = () => { document.getElementById("resetq").hidden = false; };
    document.getElementById("resetyes").onclick = () => { store = {}; save(); home(); };
    window.scrollTo(0, 0);
  }

  let S = null; // session
  function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function start(deck, onlyUnsure){
    let items = deck.cards.map((c, i) => ({ deck, i, q: c[0], a: c[1] }));
    if (onlyUnsure) items = items.filter(it => statusOf(cid(deck, it.i)) !== 2);
    S = { title: deck.name, modul: deck.modul, deck, queue: shuffle(items), done: 0, total: items.length, ok: 0, again: 0, flipped: false, missed: new Set() };
    study();
  }
  function startMixed(){
    let items = [];
    DECKS.forEach(d => d.cards.forEach((c, i) => { if (statusOf(cid(d, i)) === 1) items.push({ deck: d, i, q: c[0], a: c[1] }); }));
    S = { title: "Unsichere Karten", modul: null, deck: null, queue: shuffle(items), done: 0, total: items.length, ok: 0, again: 0, flipped: false, missed: new Set() };
    study();
  }

  function study(){
    const it = S.queue[0];
    const m = it ? it.deck.modul : (S.modul || "bio");
    const pct = S.total ? (S.done / S.total * 100) : 100;
    let html = `<div class="study" style="${modVars(m)}"><div class="top"><button class="back" id="back">← Fächer</button>
      <div class="ttl"><b>${esc(S.title)}</b><span>${Math.min(S.done + 1, S.total)} / ${S.total}${S.queue.length > S.total - S.done ? " · " + (S.queue.length - (S.total - S.done)) + " zur Wiederholung" : ""}</span></div></div>
      <div class="prog" aria-hidden="true"><i style="width:${pct}%"></i></div>`;
    if (!it){
      html += `<div class="done"><h2>Runde geschafft</h2><div class="stats"><div class="g"><b>${S.ok}</b>gewusst</div><div class="n"><b>${S.missed.size}</b>nochmal</div></div>
        <div class="row">${S.missed.size && S.deck ? `<button class="btn show" id="redo">Nur die unsicheren nochmal</button>` : ""}<button class="btn ok" id="home2">Zurück zu den Fächern</button></div></div></div>`;
      app.innerHTML = html;
      document.getElementById("back").onclick = home;
      document.getElementById("home2").onclick = home;
      const r = document.getElementById("redo"); if (r) r.onclick = () => start(S.deck, true);
      return;
    }
    const tag = S.deck ? MODULES[m].name : MODULES[m].name + " · " + it.deck.name;
    html += `<div class="card" id="card" role="button" tabindex="0" aria-label="Karte umdrehen"><span class="tag">${esc(tag)}</span>
      <div class="q">${esc(it.q)}</div>
      ${S.flipped ? `<div class="a">${paras(it.a)}</div>` : `<div class="hint">Antwort im Kopf überlegen, dann tippen</div>`}</div>
      <div class="btns">${S.flipped
        ? `<button class="btn again" id="again">Nochmal</button><button class="btn ok" id="ok">Gewusst</button>`
        : `<button class="btn show" id="show">Antwort zeigen</button>`}</div></div>`;
    app.innerHTML = html;
    document.getElementById("back").onclick = home;
    const flip = () => { if (!S.flipped){ S.flipped = true; study(); } };
    document.getElementById("card").onclick = flip;
    if (!S.flipped) document.getElementById("show").onclick = flip;
    else {
      document.getElementById("again").onclick = () => answer(false);
      document.getElementById("ok").onclick = () => answer(true);
    }
  }
  function answer(ok){
    const it = S.queue.shift(); const id = cid(it.deck, it.i);
    if (ok){
      store[id] = S.missed.has(id) ? 1 : 2;
      S.done++; S.ok += S.missed.has(id) ? 0 : 1;
    } else {
      store[id] = 1; S.missed.add(id);
      const pos = Math.min(S.queue.length, 3 + Math.floor(Math.random() * 3));
      S.queue.splice(pos, 0, it);
    }
    save(); S.flipped = false; study();
  }
  document.addEventListener("keydown", e => {
    if (!S || !document.getElementById("card")) return;
    if (e.key === " " || e.key === "Enter"){ e.preventDefault(); if (!S.flipped){ S.flipped = true; study(); } }
    else if (S.flipped && (e.key === "1" || e.key === "ArrowLeft")) answer(false);
    else if (S.flipped && (e.key === "2" || e.key === "ArrowRight")) answer(true);
  });
  home();
})();
</script>
<script>
(function(){
  const bar = document.getElementById("update");
  const hardReload = () => {
    const go = () => window.location.replace(window.location.pathname + "?v=" + Date.now());
    try {
      if ("caches" in window) {
        caches.keys().then(keys => Promise.all(keys.filter(k => k.startsWith("karteikarten-") && k !== "karteikarten-fonts").map(k => caches.delete(k)))).then(go, go);
      } else go();
    } catch (e) { go(); }
    setTimeout(go, 1500);
  };
  bar.addEventListener("click", hardReload);
  if (!("serviceWorker" in navigator)) return;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController) bar.hidden = false; });
  navigator.serviceWorker.register("sw.js").then(reg => {
    document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
})();
</script>
</body>
</html>
